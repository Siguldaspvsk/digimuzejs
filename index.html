<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Intervijas</title>

  <style>
    /* ===== Krāsu mainīgie ===== */
:root{
  --bg:#f4ecd8;
  --card:#ffffff;
  --text:#2f2f2f;
  --muted:#6b6b6b;
  --brand:#4e93fc;
  --border:#d6cbb3;
  --shadow: 0 10px 25px rgba(0,0,0,.08);
}

    /* Tumšais režīms: šis strādā, ja data-theme tiek uzlikts UZ <html> elementa */
    
html[data-theme="dark"]{
  --bg:#1f1d18;        
  --card:#2a2620;      
  --text:#f1eee6;
  --muted:#b8b1a6;
  --brand:#d4af37;     
  --border:#3b352c;
  --shadow: 0 10px 25px rgba(0,0,0,.6);
}

html[data-theme="dark"] #scrollTopBtn .bg{
  stroke: rgba(255,255,255,0.2);
} 

html[data-theme="dark"] #scrollTopBtn .arrow{
  color: var(--brand);
}


html[data-theme="dark"] .card__img{
  filter: brightness(0.9) contrast(1.1);
}

html[data-theme="dark"] .card{
  border: 1px solid rgba(255,255,255,0.08);
}

html[data-theme="dark"] .card:hover{
  box-shadow: 0 12px 30px rgba(212,175,55,0.2);
}

html[data-theme="dark"] .locked::after {
  background: rgba(0,0,0,0.6);
  color: #fff;
}

    /* ===== Bāze ===== */
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0; background:var(--bg); color:var(--text);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;
      line-height:1.5;
    }

    /* ===== Augšējā josla ===== */
  .topbar{
    position:sticky; top:0; z-index:30;
    display:flex; align-items:center; justify-content:space-between;
    background:var(--bg); border-bottom:1px solid var(--border);
    padding:.6rem .9rem;
    }
  .brand{display:flex; align-items:center; gap:.5rem; color:var(--brand); font-weight:800}
  .brand__emoji{font-size:1.2rem}
  .icon-btn{background:transparent; border:1px solid var(--border); color:var(--text);
            padding:.35rem .6rem; border-radius:.5rem; cursor:pointer;
    }

    /* ===== Titulbilde + profils ===== */
  .cover-wrap{ position:relative; }
  .cover{width:100%;
    /* Desktopā seklāka, telefonā augstāka */
        aspect-ratio: 26/6;
        object-fit:cover; display:block; background:#dfe3ee;
    }

    /* Baltais profila konteiners, kas pārklājas ar titulbildes apakšu */
  .profile-bar{background: var(--card);
                position:relative;
                display:flex; align-items:center; gap:1rem;
    /* ŠEIT galvenās izmaiņas: profila bloka platums plūst līdzi ekrānam */
                width: clamp(280px, 92vw, 920px);
                margin: -48px auto 0;           /* pārklāšanās ar cover apakšu */
                padding: .8rem 1rem;
                border:1px solid var(--border);
                border-radius:.9rem;
                box-shadow: var(--shadow);
    }

  .avatar{
    /* Avatāram arī plūstošs izmērs, bet ar minimumu */
      width: clamp(72px, 10vw, 140px);
      height: clamp(72px, 10vw, 140px);
      border-radius:50%; object-fit:contain;
      border:3px solid var(--card); box-shadow:var(--shadow); background:#cbd5e1;
      flex: 0 0 auto;
    }

  .profile-info{display:flex; flex-direction:column; min-width: 0; }
    /* Nosaukums plūstoši samazinās */
  .plant-name{
      margin:.1rem 0 0 0;
      font-size: clamp(1.05rem, 3.2vw, 1.7rem);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  .muted{ color:var(--muted); }

    /* ===== Saturs ===== */
  .container{
      width:min(1100px, 100%); margin: .8rem auto 2rem; padding: 0 1rem;
    }

    /* Konteineri (kartītes) – balti */
  .cards{display:grid; gap:1rem;
          grid-template-columns: 1fr;
    }
  @media (min-width: 600px){
    .cards{ grid-template-columns: repeat(2, 1fr); }
    }
  @media (min-width: 960px){
    .cards{ grid-template-columns: repeat(3, 1fr); }
    }

  .card{background:var(--card);
      border:1px solid var(--border);
      border-radius:0.6rem;
      box-shadow:var(--shadow);
      overflow:hidden;
      display:flex; flex-direction:column;
      transition: transform 0.3s;
    }
   
  .card:hover {transform: scale(1.03);
}

  .card:hover * {cursor: url('ant1_small.png') 16 16, pointer;
}

  .card__img{
      width:100%;
      aspect-ratio: 4/3;
      object-fit:cover;
      background:#e5e7eb;
      display:block;
      filter: contrast(1.05) saturate(0.9);
    }
  .card__body{
      padding:.75rem .9rem;
    }
  .card__title{ margin:0 0 .25rem; font-size:1rem; }
  .card__text{ margin:0; color:var(--muted); }

    /* ===== Adaptīvie pielāgojumi ===== */
  @media (max-width: 900px){
    .profile-bar{
        gap:.8rem;
        padding:.7rem .9rem;
        margin-top: -42px;             /* mazliet mazāk pārklāšanās */
        width: clamp(260px, 94vw, 840px);
      }
    .cover{ aspect-ratio: 16/7; }    /* telefonā cover nedaudz augstāks */
    }

  @media (max-width: 600px){
    .profile-bar{
        gap:.7rem;
        padding:.6rem .8rem;
        margin-top: -36px;
        width: clamp(240px, 96vw, 720px);
      }
    .plant-name{ font-size: clamp(1rem, 4.2vw, 1.4rem); }
    }

    /* ===== Kājene ===== */
  .footer{ text-align:center; color:var(--muted); padding: 2rem 1rem; }
    /* ===== MODAL LOGS ===== */

  .modal-backdrop{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    z-index: 200;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease;
}

  .modal-backdrop.active{
    opacity: 1;
    pointer-events: auto;
}

  .modal-window{
    background: var(--card);
    border-radius: 1rem;
    box-shadow: var(--shadow);
    max-width: 520px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 1.2rem 1.4rem;
    position: relative;
    border: 1px solid var(--border);
    animation: modalShow .3s ease;
}

@keyframes modalShow {
  from { transform: translateY(20px); opacity: 0; }
  to { transform: translateY(0); opacity: 1; }
}

  .modal-close{
    position: absolute;
    top: .6rem;
    right: .6rem;
    background: transparent;
    border: none;
    font-size: 1.4rem;
    color: var(--text);
    cursor: pointer;
}
  /* ===== Scroll to top poga ===== */
  #scrollTopBtn{
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 300;

    width: 48px;
    height: 48px;
    border: none;
    background: transparent;
    cursor: pointer;

    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;

  /* ✅ PIEVIENO ŠO */
    display: flex;
    align-items: center;
    justify-content: center;
}

  #scrollTopBtn.show{
    opacity: 1;
    pointer-events: auto;
}

  /* SVG */
  #scrollTopBtn svg{
    transform: rotate(-90deg);
}

  #scrollTopBtn circle{
    fill: none;
    stroke-width: 4;
}

  #scrollTopBtn .bg{
    stroke: rgba(0,0,0,0.1);
}

  #scrollTopBtn .progress{
    stroke: var(--brand);
    stroke-linecap: round;
    stroke-dasharray: 126; /* 2πr ≈ 2×3.14×20 */
    stroke-dashoffset: 126;
    transition: stroke-dashoffset .1s linear;
}

  /* Bultiņa */
  #scrollTopBtn .arrow{
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--brand);
    font-size: 16px;
    font-weight: bold;
}
  .locked {
    filter: blur(4px);
    pointer-events: none;
    position: relative;
}

  .locked .card__img {
    filter: blur(4px);
}

  .locked::after {
    content: " ";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 1.2rem;
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(2px);
}
  </style>
</head>

          date: '2026-07-29'
        },
      ];

function renderCards(){
  const today = new Date();

  cardsWrap.replaceChildren(
    ...cards.map(c => {
      const el = cardEl(c);

      
if (!c.date || new Date(c.date) > today) {
  el.classList.add('locked');
}

      return el;
    })
  );
}

      function cardEl(c){
  const card = document.createElement('article');
  card.className = 'card';
  card.tabIndex = 0; 
  card.style.cursor = 'pointer';

  
card.addEventListener('click', () => {
  if (c.pdf) {
    window.open(c.pdf, '_blank');
  }
});

  const img = document.createElement('img');
  img.className = 'card__img';
  img.alt = c.title;
  img.src = c.img;

  const body = document.createElement('div');
  body.className = 'card__body';

  const h3 = document.createElement('h3');
  h3.className = 'card__title';
  h3.textContent = c.title;

  const p = document.createElement('p');
  p.className = 'card__text';
  p.textContent = c.text;

  body.append(h3, p);
  card.append(img, body);
  return card;
}

      renderCards();
/* ===== Modal logika ===== */
const modal = document.getElementById('modal');
const modalTitle = document.getElementById('modalTitle');
const modalText = document.getElementById('modalText');
const modalImg = document.getElementById('modalImg');
const modalClose = document.getElementById('modalClose');

function openModal(c){
  modalTitle.textContent = c.title;
  modalText.textContent = c.text;
  modalImg.src = c.img;

  modal.classList.add('active');
}

function closeModal(){
  modal.classList.remove('active');
}

modalClose.addEventListener('click', closeModal);

// Aizver, klikšķinot ārpus lodziņa
modal.addEventListener('click', e => {
  if (e.target === modal) closeModal();
});

// Aizver ar ESC
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

/* ===== Scroll to top ===== */
const scrollBtn = document.getElementById('scrollTopBtn');
const progressCircle = scrollBtn.querySelector('.progress');

const radius = 20;
const circumference = 2 * Math.PI * radius;

progressCircle.style.strokeDasharray = circumference;

window.addEventListener('scroll', () => {

  const scrollTop = window.scrollY;
  const docHeight = document.documentElement.scrollHeight - window.innerHeight;
  const scrollPercent = scrollTop / docHeight;

  const offset = circumference - (scrollPercent * circumference);
  progressCircle.style.strokeDashoffset = offset;

  // Parāda pogu
  if (scrollTop > 50) {
    scrollBtn.classList.add('show');
  } else {
    scrollBtn.classList.remove('show');
  }
});

// Klikšķis
scrollBtn.addEventListener('click', () => {
  window.scrollTo({
    top: 0,
    behavior: 'smooth'
  });
});
    })();
  </script>
